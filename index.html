<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Movie Collection</title>
        <style>
            * { box-sizing: border-box; }

            body {
                margin: 0;
                font-family: Arial, Helvetica, sans-serif;
                background: #ffffff;
                color: #1a1a1a;
                padding: 2rem;
            }
                
            .container {
                max-width: 800px;
                margin: 0 auto;
            }

            h1 {
                text-align: center;
                font-size: 2rem;
                margin: 0 0 2rem 0;
            }

            h2 {
                font-size: 1.3rem;
                margin: 0 0 0.75rem 0;
            }

            section {
                margin-bottom: 2rem;
            }

            /* Add movie form */
            #movieForm {
                display: flex;
                gap: 0.6rem;
                flex-wrap: wrap;
            }

            #movieForm input {
                flex: 1 1 160px;
                padding: 0.55rem 0.7rem;
                border: 1px solid #ccc;
                border-radius: 4px;
                font-size: 0.95rem;
                color: #565758;
            }

            #movieForm input::placeholder {
                color: #565758;
                opacity: 0.6;
            }

            #movieForm button,
            #loadBtn {
                padding: 0.55rem 1.1rem;
                background: #f0f0f0;
                border: 1px solid #ccc;
                border-radius: 4px;
                font-size: 0.95rem;
                cursor: pointer;
                color: #1a1a1a;
                white-space: nowrap;
            }

            #movieForm button:hover,
            #loadBtn:hover {
                background: #e2e2e2;
            }

            #movieForm button:disabled {
                opacity: 0.6;
                cursor: not-allowed;
            }

            #formMessage {
                margin-top: 0.6rem;
                font-weight: bold;
                font-size: 0.95rem;
                min-height: 1.2em;
            }

            #formMessage.success { color: #1a7f37; }
            #formMessage.error { color: #d1242f; }

            #loadBtn {
                margin-bottom: 1rem;
            }

            /* Table */
            table {
                width: 100%;
                border-collapse: collapse;
                font-size: 0.95rem;
            }
            thead th {
                text-align: left;
                background: #f2f2f2;
                padding: 0.7rem 0.9rem;
                border-bottom: 1px solid #ddd;
                border-top: 1px solid #ddd;
            }
            tbody td {
                padding: 0.7rem 0.9rem;
                border-bottom: 1px solid #eee;
            }
            tbody tr:hover {
                background: #fafafa;
            }
            #status {
                color: #666;
                font-size: 0.9rem;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>Movie Collection</h1>
            <section>
            <h2>Add Movie</h2>
            <form id="movieForm">
                <input type="text" id="title" name="title" placeholder="Title">
                <input type="text" id="genre" name="genre" placeholder="Genre">
                <input type="number" id="year" name="year" placeholder="Year">
                <button type="submit" id="submitBtn">Add Movie</button>
            </form>
            <div id="formMessage"></div>
            </section>

            <section>
                <h2>Movies</h2>
                <button id="loadBtn" type="button">Load Movies</button>
                <p id="status"></p>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Genre</th>
                            <th>Year</th>
                        </tr>
                    </thead>
                    <tbody id="movieTableBody">
                        <!-- Movies will be dynamically added here -->
                    </tbody>
                </table>
            </section>
        </div>

    <script>
    const API_URL = '/api/movies';

    const movieTableBody = document.getElementById('movieTableBody');
    const status = document.getElementById('status');
    const form = document.getElementById('movieForm');
    const formMessage = document.getElementById('formMessage');
    const submitBtn = document.getElementById('submitBtn');
    const loadBtn = document.getElementById('loadBtn');

    function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
    }

    async function loadMovies() {
    status.textContent = 'Loading movies…';
    movieTableBody.innerHTML = '';

    try {
        const res = await fetch(API_URL);
        if (!res.ok) throw new Error('Failed to load movies');
        const movies = await res.json();

        if (movies.length === 0) {
        status.textContent = 'No movies yet. Add one above!';
        return;
        }

        status.textContent = '';
        movies.forEach((movie) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td class="id-cell">${movie.id}</td>
            <td>${escapeHtml(movie.title)}</td>
            <td>${escapeHtml(movie.genre)}</td>
            <td>${movie.year}</td>
        `;
        movieTableBody.appendChild(tr);
        });
    } catch (err) {
        status.textContent = 'Error loading movies: ' + err.message;
    }
    }

    loadBtn.addEventListener('click', loadMovies);

    form.addEventListener('submit', async (e) => {
    e.preventDefault();
    formMessage.textContent = '';
    formMessage.className = '';

    const title = document.getElementById('title').value.trim();
    const genre = document.getElementById('genre').value.trim();
    const year = document.getElementById('year').value.trim();

    if (!title || !genre || !year) {
        formMessage.textContent = 'All fields (title, genre, year) are required.';
        formMessage.className = 'error';
        return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Adding…';

    try {
        const res = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title, genre, year: Number(year) }),
        });

        const data = await res.json();

        if (!res.ok) {
            throw new Error(data.error || 'Failed to add movie');
        }

        form.reset();
        formMessage.textContent = 'Movie added successfully';
        formMessage.className = 'success';
        await loadMovies();
        } catch (err) {
        formMessage.textContent = err.message;
        formMessage.className = 'error';
        } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Add Movie';
        }
    });

    loadMovies();
    </script>
    </body>
</html>
