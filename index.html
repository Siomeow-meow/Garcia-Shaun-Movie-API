<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Collection</title>
<style src="/style.css"></style>
</head>
<body>
    <div class="container">
        <h1>Movie Collection</h1>
        <section>
        <h2>Add Movie</h2>
        <form id="movieForm">
            <input type="text" id="title" name="title" placeholder="Title">
            <input type="text" id="genre" name="genre" placeholder="Genre">
            <input type="number" id="year" name="year" placeholder="Year">
            <button type="submit" id="submitBtn">Add Movie</button>
        </form>
        <div id="formMessage"></div>
        </section>

        <section>
        <h2>Movies</h2>
        <button id="loadBtn" type="button">Load Movies</button>
        <p id="status"></p>
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Genre</th>
                <th>Year</th>
            </tr>
            </thead>
            <tbody id="movieTableBody"></tbody>
        </table>
    </section>
</div>

<script>
const API_URL = '/api/movies';

const movieTableBody = document.getElementById('movieTableBody');
const status = document.getElementById('status');
const form = document.getElementById('movieForm');
const formMessage = document.getElementById('formMessage');
const submitBtn = document.getElementById('submitBtn');
const loadBtn = document.getElementById('loadBtn');

function escapeHtml(str) {
const div = document.createElement('div');
div.textContent = str;
return div.innerHTML;
}

async function loadMovies() {
status.textContent = 'Loading movies…';
movieTableBody.innerHTML = '';

try {
    const res = await fetch(API_URL);
    if (!res.ok) throw new Error('Failed to load movies');
    const movies = await res.json();

    if (movies.length === 0) {
    status.textContent = 'No movies yet. Add one above!';
    return;
    }

    status.textContent = '';
    movies.forEach((movie) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
        <td class="id-cell">${movie.id}</td>
        <td>${escapeHtml(movie.title)}</td>
        <td>${escapeHtml(movie.genre)}</td>
        <td>${movie.year}</td>
    `;
    movieTableBody.appendChild(tr);
    });
} catch (err) {
    status.textContent = 'Error loading movies: ' + err.message;
}
}

loadBtn.addEventListener('click', loadMovies);

form.addEventListener('submit', async (e) => {
e.preventDefault();
formMessage.textContent = '';
formMessage.className = '';

const title = document.getElementById('title').value.trim();
const genre = document.getElementById('genre').value.trim();
const year = document.getElementById('year').value.trim();

if (!title || !genre || !year) {
    formMessage.textContent = 'All fields (title, genre, year) are required.';
    formMessage.className = 'error';
    return;
}

submitBtn.disabled = true;
submitBtn.textContent = 'Adding…';

try {
    const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, genre, year: Number(year) }),
    });

    const data = await res.json();

    if (!res.ok) {
        throw new Error(data.error || 'Failed to add movie');
    }

    form.reset();
    formMessage.textContent = 'Movie added successfully';
    formMessage.className = 'success';
    await loadMovies();
    } catch (err) {
    formMessage.textContent = err.message;
    formMessage.className = 'error';
    } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Add Movie';
    }
});

loadMovies();
</script>
</body>
</html>
